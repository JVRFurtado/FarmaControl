services:
  - type: web
    name: farmcontrol
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn farmacontrol.wsgi
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmcontrol-db
          property: connectionString

databases:
  - name: farmcontrol-db
    plan: free


