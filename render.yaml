services:
  - type: web
    name: farmcontrol
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn farmacontrol.wsgi:application --log-file -
    healthCheckPath: /usuarios/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farmcontrol-db
          property: connectionString
      # Senhas iniciais: o Render pede os valores no primeiro deploy
      # (sync: false = nunca ficam no repositório).
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: GESTOR_INITIAL_PASSWORD
        sync: false
      - key: ATENDENTE_INITIAL_PASSWORD
        sync: false

databases:
  - name: farmcontrol-db
    plan: free
